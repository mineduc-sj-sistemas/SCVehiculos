<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b32" />
      <stop offset="100%" stop-color="#050e1a" />
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ea580c" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background rounded card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Sun Emblem -->
  <g transform="translate(256, 230) scale(4.4)" filter="url(#glow)">
    <circle cx="0" cy="0" r="14" fill="url(#sunGrad)" />
    <circle cx="0" cy="0" r="7.5" fill="#fef08a" />
    <circle cx="0" cy="-32" r="7" fill="#ea580c" />
    <circle cx="0" cy="32" r="7" fill="#ea580c" />
    <circle cx="-32" cy="0" r="7" fill="#ea580c" />
    <circle cx="32" cy="0" r="7" fill="#ea580c" />
    <circle cx="-22.6" cy="-22.6" r="6" fill="#f59e0b" />
    <circle cx="22.6" cy="-22.6" r="6" fill="#f59e0b" />
    <circle cx="-22.6" cy="22.6" r="6" fill="#f59e0b" />
    <circle cx="22.6" cy="22.6" r="6" fill="#f59e0b" />
    <path d="M0 -14V-25 M0 14V25 M-14 0H-25 M14 0H25" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="445" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" letter-spacing="2" fill="#ffffff">SCVEHÍCULOS</text>
  <text x="256" y="475" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" letter-spacing="4" fill="#ea580c">GOBIERNO DE SAN JUAN</text>
</svg>
