<!DOCTYPE html>
<html lang="es" class="h-full bg-[#0b1b32]">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1b32" />
  <title>Sin Conexión · SCVehículos</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: radial-gradient(circle at 50% 20%, #172a46 0%, #0b1b32 70%, #060e1a 100%);
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(234, 88, 12, 0.18);
      color: #fb923c;
      border: 1px solid rgba(234, 88, 12, 0.35);
      border-radius: 9999px;
      padding: 0.35rem 0.9rem;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    .icon-container {
      width: 80px;
      height: 80px;
      margin: 0 auto 1.5rem;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.2), rgba(245, 158, 11, 0.05));
      border: 1px solid rgba(234, 88, 12, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .icon-container svg {
      width: 40px;
      height: 40px;
      color: #fb923c;
    }
    .pulse-ring {
      position: absolute;
      inset: -4px;
      border-radius: 28px;
      border: 2px solid rgba(234, 88, 12, 0.3);
      animation: pulse 2.5s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.04); }
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 0.75rem;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 0.925rem;
      line-height: 1.55;
      color: #94a3b8;
      margin-bottom: 2rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      width: 100%;
      background: linear-gradient(135deg, #ea580c 0%, #c2410c 100%);
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 700;
      padding: 0.875rem 1.5rem;
      border-radius: 16px;
      border: none;
      cursor: pointer;
      box-shadow: 0 10px 20px -5px rgba(234, 88, 12, 0.4);
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 24px -5px rgba(234, 88, 12, 0.5);
    }
    .btn:active {
      transform: translateY(0);
    }
    .brand-footer {
      margin-top: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 600;
    }
    .brand-footer img {
      height: 22px;
      width: auto;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">
      <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background:#ea580c;"></span>
      Modo Sin Conexión
    </div>

    <div class="icon-container">
      <div class="pulse-ring"></div>
      <!-- Wifi Off Icon -->
      <svg fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <line x1="1" y1="1" x2="23" y2="23"></line>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
        <path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
        <line x1="12" y1="20" x2="12.01" y2="20"></line>
      </svg>
    </div>

    <h1>Sin Conexión a Internet</h1>
    <p>No se pudo conectar con el servidor de <strong>SCVehículos</strong>. Verificá tu red de datos móviles o WiFi. Al recuperar señal, la pantalla se actualizará automáticamente.</p>

    <button id="retry-btn" class="btn" onclick="retryConnection()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
      <span>Reintentar Conexión</span>
    </button>

    <div class="brand-footer">
      <span>Ministerio de Educación · San Juan</span>
    </div>
  </div>

  <script>
    function retryConnection() {
      const btn = document.getElementById('retry-btn');
      if (btn) {
        btn.disabled = true;
        btn.style.opacity = '0.7';
        btn.querySelector('span').textContent = 'Comprobando señal...';
      }
      fetch('/', { method: 'HEAD', cache: 'no-store' })
        .then(() => {
          window.location.reload();
        })
        .catch(() => {
          setTimeout(() => {
            if (btn) {
              btn.disabled = false;
              btn.style.opacity = '1';
              btn.querySelector('span').textContent = 'Reintentar Conexión';
            }
          }, 800);
        });
    }

    // Auto-recarga instantánea al volver la señal
    window.addEventListener('online', () => {
      window.location.reload();
    });
  </script>
</body>
</html>
