services:
  # Servicio de Base de Datos MySQL
  db:
    image: mysql:8.0
    container_name: sc_vehiculos_db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: sc_vehiculos
    ports:
      # Puerto 3307 en el host para no colisionar con MySQL local/Laragon (3306)
      - "3307:3306"
    volumes:
      - sc_mysql_data:/var/lib/mysql
      # Script de inicialización automática con todas las tablas y datos demo
      - ./database/sc_vehiculos_completa.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootpassword || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - sc_network

  # Servicio de la Aplicación Astro + Node.js
  app:
    container_name: sc_vehiculos_app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "4321:4321"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4321
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: sc_vehiculos
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sc_network

volumes:
  sc_mysql_data:
    name: sc_vehiculos_mysql_data

networks:
  sc_network:
    name: sc_vehiculos_network
    driver: bridge
