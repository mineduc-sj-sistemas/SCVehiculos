# Docker Compose para Desarrollo (con hot-reload y volúmenes montados)
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  app:
    build:
      target: deps
    command: pnpm dev --host 0.0.0.0
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.astro
