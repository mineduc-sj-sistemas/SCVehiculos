# Docker Compose para Desarrollo (con hot-reload y volúmenes montados)
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
services:
  app:
    build:
      target: deps
    command: pnpm dev --host 0.0.0.0
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 4321
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: sc_vehiculos
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.astro
